name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Match the Lambda runtime pinned in template.yaml + mise.toml so
      # CI failures reproduce locally under the same interpreter.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            src/requirements.txt

      - name: Install project (editable) + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff (lint)
        run: ruff check src/ tests/ mcp_server/

      - name: Black (format check)
        run: black --check src/ tests/ mcp_server/

      # --cov-fail-under=99 enforces near-100% on the source package.
      # All src modules now have 100% coverage; this floor catches any
      # regression that drops a module below 100% without a deliberate
      # acceptance note.
      - name: Pytest with coverage
        run: pytest --cov=code_review_agent --cov-report=term-missing --cov-fail-under=99

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM template validation
        run: sam validate --lint

      # JD Round 1 F5: `sam validate` only parses the template. It does not
      # exercise `src/requirements.txt`, so a runtime-dep drift (added a
      # dep to pyproject.toml but not src/requirements.txt) would go
      # unnoticed until deploy. `sam build` writes .aws-sam/build/ using
      # the runtime deps declared in src/requirements.txt against the same
      # Python 3.12 interpreter provisioned above — a resolution failure
      # here is a real signal that the deployment package is broken.
      - name: SAM build (verifies src/requirements.txt resolves)
        run: sam build --use-container=false
