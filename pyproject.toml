[project]
name = "code-review-agent"
version = "0.1.0"
description = "Automated GitHub PR reviewer powered by Amazon Bedrock"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "mrs"}]

dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto[s3,secretsmanager]>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "mcp_server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101"]  # allow assert in tests

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=code_review_agent --cov-report=term-missing"
